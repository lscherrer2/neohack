# Packing cell layout. Edit to match your table, then: python -m packing check
#
# Every LOCATION name below gets two taught poses:
#   <name>.above   safe spot a few cm above it (gripper clear of everything)
#   <name>.at      where the gripper closes / opens
# Teach them with: python -m packing teach-all --missing

robot:
  port: /dev/cu.usbmodem5CE51213501
  id: my_awesome_follower_arm

poses_file: data/poses.json
inventory_db: data/inventory.db   # or ":memory:" (forgotten when each command exits)
travel_pose: home          # arm passes through this between stations ('home' = taught pose; default all-zero mid-pose)

locations:
  part_slots: {}           # taught single slots (location: sku); parts now come from the tray below
  box_supply: [box_in_1, box_in_2]     # where empty boxes start
  pack_station: pack_1                 # box sits here while parts go in
  box_output: [box_out_1, box_out_2]   # where finished boxes go

# Parts tray: pockets are read from the DXF; its pose from `python -m packing tray-calibrate`.
# Pocket ids are <sku>_<n>, n=1 = row nearest the arm (DXF y=0). Plan: .claude/plans/tray_layout.md
tray:
  dxf: ../part.dxf
  calibration_file: data/tray_cal.json
  protrusion_mm: 10        # every item sticks out this far above the tray face
  extract_mm: 120          # (not used by picks any more: the pull-out is per part, see pull_mm below)
  approach_mm: 30
  # picking (packing/tray/pick.py): approach along the normal, grip, pull straight out, lift
  grasp_standoff_mm: 3.81  # 0.15 in: gripper tip this far off the tray face when it closes
  pull_mm: 150             # MAX straight pull-out along the normal. Per part: needs (length_mm − protrusion) + 10 mm
                           # to clear its socket, prefers up to 40 mm more where it fits
  lift_mm: 100             # then straight up (drop spot: TBD)
  max_pitch_deg: 40        # tool may pitch down this much so the pull fits (smallest pitch that fits wins)
  pitch_step_deg: 10
  calibration_mode: corners   # corners: touch the middle of each rounded plate corner | pockets: reference_points
  reference_points: [aa_1, aa_7, breadboard_1, breadboard_5]   # pocket centers touched in "pockets" mode
  types:                   # sku: DXF feature (mm) + which tray axis the fingers close along;
                           # length_mm = how far the part hangs past the jaws once picked (ESTIMATES: measure)
    aa:         {name: AA battery,    feature: circle,   size: 15.5,        grip_axis: x, length_mm: 50}
    9v:         {name: 9V battery,    feature: rect,     size: [27.5, 18.5], grip_axis: x, length_mm: 48}
    piezo:      {name: piezo speaker, feature: pin_pair, size: 1.3, spacing: 8, grip_axis: x, grip_mm: 12, length_mm: 15}   # body Ø: estimate, measure
    glue:       {name: glue stick,    feature: circle,   size: 12.5,        grip_axis: x, length_mm: 120}
    breadboard: {name: breadboard,    feature: rect,     size: [52, 2.5],   grip_axis: y, min_grip: 1, length_mm: 40}   # thin: tune on hardware

# catalog: (sku -> spoken name) defaults to the tray type names above

# Packing boxes (box.step): calibrated by hand — motors off, gripper LEVEL pointing along the tab, jaws closed
# up/down on it, "Add box" (Calibration tab).
# Each box's tab faces the arm's swivel; supply boxes sit on the LEFT, packed ones go to the mirrored spot on the
# right. Plan: .claude/plans/boxes_and_reservations.md
boxes:
  grip_from_wall_mm: 8     # tool point this far out from the box wall along the tab when calibrating (estimate:
                           # drawing / drops only — the grasp itself is exactly the calibrated one)
  pack_spot_mm: [355, 0]   # box center (robot x, y) where an order is packed: middle of the sweep. The level tab
                           # grip reaches only with the grip point >= ~25 cm from the swivel -> box centers >= ~30 cm;
                           # 355 works for grips 8–20 mm from the wall (345: deeper grips fail; 365+: drops fail)
  carry_mm: 30             # lift boxes straight up this far before moving them (no dragging, clears neighbours)
  fixed_jaw: bottom        # grip with the FIXED jaw under the tab, moving jaw on top (boxes calibrated the other way
                           # are flipped 180° when planning). top / as_calibrated
  min_center_mm: 305       # box centers at least this far from the swivel (closer: the level approach / back-out
                           # along the tab can't be reached). Add box refuses closer boxes
  approach_mm: 22          # open jaws come in level along the tab from this far back, and back out after (clears the
                           # tab tip; much longer would bring the grip point under the ~25 cm level-grip limit)
  line_speed_mm_s: 60      # straight lifts / slides along the tab (2.5x the first cautious 25)
  down_speed_mm_s: 30      # last bit down onto the tab / the table
  carry_speed_mm_s: 120    # guided carries (arc up + swing high + arc down, one continuous move): max tool speed
  carry_joint_speed: 60    # ...paced by the busiest joint (units/s), so the swing near the swivel isn't slow
  free_speed: 30           # free joint moves in box moves (units/s)
  jaw_gap_mm: 24           # jaws open this wide (fingertips) to come in on the tab and to let go / back out (2x the
                           # first 12 mm: slack when reaching far out)

# Desk plane (packing/boxes/desk.py): Calibration tab → Desk — motors off, touch the closed jaw tip to the desk at
# 3+ spots far apart (left, middle, right). Box spots then take their height from it (base / desk tilt).
desk:
  calibration_file: data/desk_cal.json

max_items_per_order: 10    # items one order (= one box) may hold
box_slots:                 # drop spots inside the box *at the pack station*, filled in order;
  - {pose: box_slot_1}     # with fewer spots than items they repeat (item i -> spot i % len). Any sku

gripper:
  open: 60                 # verified Nov 2026: higher = more open (0 = jaws closed)
  closed: 0
  speed: 40
  squeeze: 3
  min_part_width: 3        # if the gripper closes tighter than this, the pick counts as missed
  min_box_width: 10
  open_margin_mm: 10       # picks open to part width (tray.types: grip_mm or feature size) + this, not to `open`
  jaw_length_mm: 80        # jaw pivot -> fingertip, URDF estimate (deg per unit comes from the calibration)

motion:
  speed: 30                # units/s (joint range is -100..100)
  approach_speed: 12       # final approach to grasp/release
  settle_tol: 1            # arrived when every joint is within this (sag comp makes this reachable)
  settle_timeout: 3.0
  max_following_error: 20  # stop if a joint lags this much (collision / stall)
  max_step: 25             # library per-command safety cap; must exceed sag_max
  sag_gain: 0.08           # gravity-sag compensation (0 = off)
  sag_max: 15              # max correction, units
  lead_s: 0.077            # velocity feed-forward: servo lag ~0.1 s at P=24, scaled 24/31 for P=31 (Nov 2026)
  gravity_gain: 3.21       # gravity feed-forward, units/N*m: fit 4.15 at P=24, scaled 24/31 (real arm only; 0 = off)
  servo_p: 31              # servo stiffness: 16 = connect default, 32 = factory; 31 tracks best (vs 17/24, Nov 2026)
  servo_accel: 254         # servo acceleration; 254 = max = follow our trajectory (20 doubled tracking lag, Nov 2026)

remote:                    # LLM contingency control: python -m packing.remote (see packing/README.md)
  default_step_cm: 2
  max_step_cm: 5
  tip_speed_mm_s: 20       # slow
  min_z_m: 0.04            # safe box for the gripper tip (robot frame, meters; z=0 = bottom of base)
  max_z_m: 0.35
  min_reach_m: 0.12
  max_reach_m: 0.40
  max_side_m: 0.30
  joint_limit: 90
  log_file: data/remote_log.jsonl
  cameras: []              # e.g. [{name: front, index_or_path: 0}, {name: wrist, index_or_path: 1}]
                           # camera index for cv2.VideoCapture (0 = first camera)
